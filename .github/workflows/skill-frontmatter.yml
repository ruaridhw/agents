# CI guards that run on every PR, including ones opened from a Mac checkout:
# the front-matter lint and check-public (its denylist comes from the
# PUBLIC_DENYLIST_RULES repository secret). Ruff, ty and gitleaks stay in pre-commit.
name: skill-frontmatter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint SKILL.md front matter
        run: uv run --group dev bin/check-skill-frontmatter
      - name: check-public (denylist from the repository secret)
        env:
          PUBLIC_DENYLIST_RULES: ${{ secrets.PUBLIC_DENYLIST_RULES }}
        run: python3 bin/check-public --all
